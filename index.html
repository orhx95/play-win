<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e24"><title>Play&Win</title>
<style>
:root{color-scheme:dark;--bg:#080e24;--panel:#151f42;--violet:#7047f7;--teal:#37d7ca;--gold:#ffd15a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17265a,var(--bg) 58%);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#fff;min-height:100vh}
main{max-width:680px;margin:auto;padding:18px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.brand{font-size:1.35rem;font-weight:900;letter-spacing:.3px}.coin{background:#222d50;border:1px solid #3a4974;padding:9px 12px;border-radius:999px;color:var(--gold);font-weight:800}
.card{background:linear-gradient(145deg,#17234b,#111a37);border:1px solid #2a3a68;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 10px 28px #0002}.hero{background:linear-gradient(120deg,#3c25a5,#1469a8);border:0}.muted{color:#b8c7eb;font-size:.92rem}.bar{height:9px;background:#344263;border-radius:20px;overflow:hidden;margin:12px 0 6px}.bar span{display:block;height:100%;background:var(--teal);width:0%}button{border:0;border-radius:13px;background:var(--violet);color:white;font-weight:750;padding:12px 14px;font-size:.95rem;cursor:pointer;min-height:44px}button:disabled{opacity:.45;cursor:not-allowed}.outline{background:transparent;border:1px solid #7c6aff}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#080e24ee;backdrop-filter:blur(14px);border-top:1px solid #29365e;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:2}.nav button{flex:1;max-width:160px;background:transparent;color:#adbee8;padding:10px 4px;font-size:.82rem}.nav button.active{background:#33246e;color:white}.game{display:flex;align-items:center;gap:13px}.emoji{font-size:2.1rem;background:#283665;border-radius:16px;padding:10px}.game .grow{flex:1;min-width:0}.game button{padding:10px}.title{font-size:1.25rem;font-weight:850;margin:5px 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.notice{background:#202b4c;padding:13px;border-radius:13px;color:#d7e1ff;font-size:.9rem}.tag{font-size:.75rem;background:#26365d;border-radius:999px;padding:5px 9px;color:#c6d5ff}
@media(max-width:380px){main{padding:13px 10px 95px}.card{padding:13px}.game{gap:8px}.game button{padding:9px}.emoji{font-size:1.7rem;padding:8px}}
</style></head><body><main>
<header class="top"><div class="brand">🎮 Play&Win</div><div class="coin">🪙 <span id="points">0</span> pts</div></header>
<section class="card"><div class="row"><div><div class="muted">TU PERFIL</div><div style="font-size:1.3rem;font-weight:850">Jugador · Nivel <span id="level">1</span></div></div><div style="font-size:2.2rem">🏆</div></div><div class="bar"><span id="xpbar"></span></div><div class="muted"><span id="xp">0</span>/200 XP para el siguiente nivel</div></section>
<div id="content"></div>
<section class="notice" id="notice">¡Bienvenido a Play&Win! Tus puntos son virtuales y no tienen valor monetario.</section>
<div style="text-align:center;font-size:.75rem;color:#b8c7eb;margin-top:12px">Prototipo de prueba · Sin pagos ni premios reales</div>
</main><nav class="nav"><button data-tab="home" class="active">🏠<br>Inicio</button><button data-tab="games">🎮<br>Juegos</button><button data-tab="missions">🎯<br>Misiones</button><button data-tab="shop">🎁<br>Tienda</button></nav>
<script>
const defaults={points:0,xp:0,plays:0,claimed:[],daily:false,owned:[]};let s={...defaults};
try{s={...defaults,...JSON.parse(localStorage.getItem('playwin-save')||'{}')}}catch(e){}
let tab='home';const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('playwin-save',JSON.stringify(s))}catch(e){}render()}
function say(t){$('notice').textContent=t}
function play(name,pts){s.points+=pts;s.xp+=pts;s.plays++;say(`${name} completado: +${pts} puntos virtuales.`);save()}
function claim(id,title,pts){if(s.claimed.includes(id))return;s.claimed.push(id);s.points+=pts;say(`¡Misión "${title}" reclamada! +${pts} puntos.`);save()}
function game(emoji,title,sub,pts){return `<article class="card game"><div class="emoji">${emoji}</div><div class="grow"><b>${title}</b><div class="muted">${sub} · +${pts} pts</div></div><button onclick="play('${title}',${pts})">Jugar</button></article>`}
function render(){
$('points').textContent=s.points.toLocaleString('es-ES');$('level').textContent=Math.floor(s.xp/200)+1;$('xp').textContent=s.xp%200;$('xpbar').style.width=(s.xp%200)/2+'%';
document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
if(tab==='home')$('content').innerHTML=`<section class="card hero"><div class="tag">NUEVA TEMPORADA</div><h1>¡Juega. Gana puntos. Sube de nivel!</h1><p>Completa desafíos y desbloquea objetos virtuales.</p><button onclick="tab='games';render()">Explorar juegos →</button></section><div class="title">Juegos destacados</div>${game('🚀','Rocket Challenge','Arcade',50)}${game('🧩','Puzzle Quest','Lógica',30)}${game('🧠','Trivia relámpago','Preguntas',20)}`;
if(tab==='games')$('content').innerHTML=`<div class="title">Sala de juegos</div><p class="muted">Las partidas de esta demo simulan el resultado y la recompensa.</p>${game('🏎️','Carrera turbo','Carreras',50)}${game('🔤','Reto de palabras','Palabras',30)}${game('❓','Trivia','Conocimiento',20)}`;
if(tab==='missions'){let ms=[['one','Juega 1 partida',1,40],['three','Juega 3 partidas',3,80],['two','Juega 2 partidas',2,60]];$('content').innerHTML='<div class="title">Misiones diarias</div>'+ms.map(m=>{let done=s.claimed.includes(m[0]),ready=s.plays>=m[2];return `<article class="card"><div class="row"><b>${m[1]}</b><span class="tag">+${m[3]} pts</span></div><p class="muted">Progreso: ${Math.min(s.plays,m[2])}/${m[2]}</p><button ${done||!ready?'disabled':''} onclick="claim('${m[0]}','${m[1]}',${m[3]})">${done?'Completada':ready?'Reclamar':'Juega para desbloquear'}</button></article>`}).join('')+`<article class="card"><div class="row"><div><b>🎁 Bono diario</b><div class="muted">+25 puntos virtuales</div></div><button ${s.daily?'disabled':''} onclick="s.daily=true;s.points+=25;say('¡Bono diario recibido! +25 puntos.');save()">${s.daily?'Recogido':'Recoger'}</button></div></article>`}
if(tab==='shop'){let items=[['theme','🎨','Tema neón',500],['avatar','😎','Avatar especial',300],['win','✨','Efecto de victoria',200]];$('content').innerHTML='<div class="title">Tienda virtual</div><p class="muted">Artículos cosméticos ficticios, sin canje monetario.</p>'+items.map(i=>{let owned=s.owned.includes(i[0]);return `<article class="card game"><div class="emoji">${i[1]}</div><div class="grow"><b>${i[2]}</b><div class="muted">${i[3]} puntos</div></div><button ${owned||s.points<i[3]?'disabled':''} onclick="s.points-=${i[3]};s.owned.push('${i[0]}');say('${i[2]} desbloqueado.');save()">${owned?'Desbloqueado':'Comprar'}</button></article>`}).join('')}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));render();
</script></body></html>
